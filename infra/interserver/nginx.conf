worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  log_format safe escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method","duration":$request_time}';
  access_log /dev/stdout safe;
  error_log /dev/stderr crit;
  client_max_body_size 3m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  upstream backend { server api:3001; keepalive 16; }
  proxy_http_version 1.1;
  proxy_set_header Connection '';
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 55s;

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
  server {
    listen 80;
    server_name api.ciframais.com.br efi-webhooks.ciframais.com.br;
    # Only ACME validation uses HTTP. Application and webhooks require HTTPS.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
      try_files $uri =404;
      limit_except GET { deny all; }
    }
    location / { return 404; }
  }
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }
  server {
    listen 443 ssl;
    server_name api.ciframais.com.br;
    ssl_certificate /etc/nginx/tls/api-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/api-key.pem;
    proxy_set_header X-Efi-Client-Verify NONE;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    location = /webhooks/efi/account-opening { return 403; }
    location = /webhooks/efi/pix { return 403; }
    location ^~ /webhooks/efi/pix/ { return 403; }
    location ^~ /webhooks/efi/account-opening/ { return 403; }
    location / { proxy_pass http://backend; }
  }
  server {
    listen 443 ssl;
    server_name efi-webhooks.ciframais.com.br;
    ssl_certificate /etc/nginx/tls/efi-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/efi-key.pem;
    ssl_client_certificate /etc/nginx/tls/efi-client-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 4;
    proxy_set_header X-Efi-Client-Verify $ssl_client_verify;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    location = /webhooks/efi/account-opening { proxy_pass http://backend; }
    location = /webhooks/efi/pix { proxy_pass http://backend; }
    location / { return 404; }
  }
}
